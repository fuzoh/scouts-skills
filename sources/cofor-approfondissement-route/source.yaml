notes: 'Texte allemand seulement (aucune version française publiée, réf. 3148.01.de) ; la section reste en allemand : `split` regénère les sections depuis raw.md, la traduction est à faire dans les skills, pas dans la section. Termes : Vertiefung Roverstufe = approfondissement branche Route, LKB = CàF, Hauptkursleitung = direction de cours, Blocknummer = n° des unités d''apprentissage, Grobprogramm = programme général, Stufe = niveau, Ziel = objectif (PBS = MSdS), Rotte = équipe de Route. Formulaire PDF (AcroForm), même structure que cofor-approfondissement-eclais : cases de niveau et champs de saisie perdus ; trois tableaux par domaine (p.2 : fondements, direction et responsabilité, programme) complets ; « Autres contenus » (p.3) perd son tableau (liste de contenus, objectif J+S 1.3 collé à la dernière ligne) ; le titre de la justification finale est présent, le champ vide. Durée minimale J+S 6 heures, durée PBS 2 à 5 jours, toujours lié à une formation continue LS/T. applies_from 2027-01-01 : déduit, la check-list dérive du modèle de formation 2027 ; le document ne porte pas de date d''application propre. url vide : page de détail non relevée.'  # remarques humaines : qualité, pièges, chapitres à ignorer
