notes: 'Livre BookStack du cudesch numérique (cudesch.scout.ch, MSdS), 1 page d''accueil + 6 chapitres + 31 pages ; manifeste dans l''ordre de lecture du livre. Les pages de chapitre portent l''introduction du chapitre suivie de la liste de ses pages avec extraits (lien et premières lignes), à ignorer ; la page d''accueil liste aussi les chapitres. Ancres bkmrk-… conservées sur les titres (citation `id <url>#bkmrk-…`). Pertes trafilatura : images (schémas des attentes, du devoir de diligence, des assurances, du feu de signalisation, aide-mémoire d''urgence J+S, diagramme de conduite en cas d''événement) ; les tableaux (responsabilité civile et pénale, assurances, activités à caractère dangereux, concepts de sécurité modèles, méthode 3 x 3) sont aplatis en lignes de texte mais complets. Les exemples de concepts de sécurité (pont de corde, grand jeu, sarasine, baignade, randonnée, camp d''été à Bergün) contiennent des noms de scout et numéros de téléphone fictifs d''exemple. Page très longue en un seul fichier : Exemple de concept de sécurité pour un camp sous tente (1 600 mots). Numéros § posés par l''agent.'                               # remarques humaines : qualité, pièges, chapitres à ignorer
