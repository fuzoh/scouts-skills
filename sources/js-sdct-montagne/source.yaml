notes: 'Brochure OFSPO 2014 (n° 30.401.530 f), sans signets ; arbre réécrit d''après le sommaire imprimé (p.3). page_offset 2 (vérifié p.4, 19, 53). NORDA et Exercices d''orientation partagent la p.32 : regroupés en un nœud (p.31-32). Texte lisible. Tableaux linéarisés : échelle CAS T1-T6 (p.11-13, en-têtes de colonnes séparés des valeurs), calcul du temps de marche (p.16), comparaison des réchauds (p.42). Encadrés latéraux parfois avant le titre de page (p.14, 17). Contenu de 2014 : la règle actuelle sur les concepts de sécurité est dans js-manuel-sport-de-camp-trekking. Exclus : couverture, sommaire p.3, p.55 vide, impressum p.56.'
