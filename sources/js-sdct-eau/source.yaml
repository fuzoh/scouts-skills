notes: 'Brochure OFSPO 2019, 2e édition actualisée (n° 30.401.810 f), sans signets ; arbre réécrit d''après le sommaire imprimé (p.3), sous-sections ajoutées pour Planifier (p.6-11) et Technique de pagayage (p.29-32). page_offset 2 (vérifié p.5, 26, 39). Texte lisible. Tableaux linéarisés cellule par cellule, difficiles à lire : degrés de difficulté des eaux vives (p.10), hypothermie et cas d''urgence (p.41). Illustrations des techniques de pagayage et de sauvetage perdues (légendes seules). p.29 : « Gouvernail » (fin de Propulsion) est rangé avec Technique en eau vive. Exclus : couverture, sommaire p.3, p.43 vide, impressum p.44.'
