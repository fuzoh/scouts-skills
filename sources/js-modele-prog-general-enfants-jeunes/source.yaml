notes: 'Exemple de programme général de camp d''été mixte sous toit (juillet 2013), 1 p. issue du manuel J+S Sport de camp/Trekking 30.401.562 f, éd. 2014. Grille très aplatie (17 colonnes) : l''affectation des variantes 3.1a/3.1b, 6.1a-c, 6.2a-c… aux groupes d''âge (HarmoS 4e-8e, 9e-11e) repose sur la couleur, perdue ; à lire avec prudence. Quelques coquilles de la source (« Voilà-Block », « Mattihas »). Exemple, pas de prescription.'
