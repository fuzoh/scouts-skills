notes: 'Formulaire vierge (modèle de groupe pour le camp d’été commun) : rubriques dans l’ordre, six domaines à cocher (techniques de plein air, sécurité, nature et environnement, technique de pionnier, campement/logement sous toit/environs, prévention et intégration). Pied de page : renvoi à cudesch.msds.ch et lien (jugendundsport.ch, ancienne URL) vers les blocs d’exemple AC de J+S ; lien relevé dans raw.md mais probablement périmé. Coquilles d’origine : « Securité », « intégreation », « Sicherheits-konzept » (rubrique en allemand). Conversion docx : les cases ☐ sont conservées en texte ; logos, en-têtes de page, couleurs et mise en page en tableaux (cellules fusionnées, lignes vides) sont perdus ; tous les champs sont vides, le texte utile est la liste des rubriques.'
