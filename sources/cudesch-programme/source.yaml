notes: 'Livre BookStack du cudesch numérique (cudesch.scout.ch, MSdS, en ligne depuis janvier 2026), 1 page d''accueil + 2 chapitres + 11 pages ; manifeste écrit à la main depuis la table des matières du livre, dans l''ordre de lecture. Les pages de chapitre portent l''introduction du chapitre suivie de la liste de ses pages avec extraits (lien et premières lignes), à ignorer. Ancres bkmrk-… conservées sur chaque titre (citation `id <url>#bkmrk-…`). Pertes trafilatura : images (schémas du cycle, exemples de PT, affiches), encadrés « Matériel supplémentaire » rendus en gras sans distinction ; la page Planifier (4 800 mots) reste un seul fichier (une page web = une section). Numéros § posés par l''agent (le site n''en a pas). Édition papier 2018 (MSdS.3036.04.fr) en history.' # remarques humaines : qualité, pièges, chapitres à ignorer
