notes: 'Diapositives de l’UA « Construction d’un système de qualification » du cours Top : pourquoi qualifier (cinq buts), puis huit étapes (choix des objectifs, sphères, critères, indicateurs, barème, pondération, seuil de réussite, mise en page) avec un fil rouge cours RU (concept de sécurité, randonnée) ; consignes de l’exercice en fin de deck. Les diapos 12-20 et 24-28 sont des captures d’écran d’une grille d’exemple (texte dans les images, non converti) : elles montrent la même grille RU avec barème OK/KO, décompte « 2 sur 3 », pondération en nombres (2, 1) puis en pour cent (40 %, 60 %). Un document d’une page « Marche à suivre système de qualification » (cours Top 2025, texte vectoriel non extractible, lu par vision) résume les mêmes huit étapes sans rien ajouter ; non ingéré. Support non officiel : il ne fonde aucun non-négociable. Lieu du cours et prénoms des formateurs (notes des diapos) caviardés.' # remarques humaines : qualité, pièges, chapitres à ignorer
