notes: 'Formulaire PDF (AcroForm), même structure que cofor-approfondissement-eclais, adaptée à la branche Picos (réf. 3147.01) : la colonne « Niveau » est rendue par des cases cochées, perdues à la conversion, de même que les champs de saisie (CàF, n° d''UA, indications sur le cours) ; les tableaux de raw.md gardent contenu et objectif (MSdS x.y, J+S x.y). Quatre tableaux par domaine (p.2-3 : fondements, maîtrise et responsabilités, soutien d''équipe et programme, organisation de la vie d''équipe) puis « Autres contenus » (p.3) dont la structure de tableau est partielle ; lignes vides  dans les tableaux. p.1 = mode d''emploi : durée minimale J+S 6 heures, durée MSdS 2 à 5 jours, toujours lié à une formation continue Foundation Activités SdC/T ; l''envoi de la check-list sur Orbit fait office de confirmation. applies_from 2027-01-01 : déduit, la check-list dérive du modèle de formation 2027 (msds-modele-de-formation, valable dès le 01.01.2027) ; le document ne porte pas de date d''application propre. url vide : page de détail non relevée.'  # remarques humaines : qualité, pièges, chapitres à ignorer
