notes: 'Dépliant graphique de 2 p. (« L''essentiel en bref » pour responsables et participant·e·s de cours), sans numéro officiel ni version : même contenu de fond que msds-factsheet-profil (nouvelle version 2025 du profil) mais variante pour responsables. Texte complet dans raw.md, y compris le paragraphe « Les relations » (p.1, complet ici) et les huit méthodes avec mots-clés (p.2) ; encadrés dans l''ordre de la mise en page, donc mots-clés des relations et des méthodes séparés de leur titre. Pertes mineures : « per mettent », « trans mettre » (césure), « p. 1213 » pour p. 12-13 (renvoi au profil complet), « globa l » ; liste des downloads sans liens ; illustrations des branches absentes. Renvois « p. 12-13 » et « p. 16-25 » = pages du profil du scoutisme, pas de ce dépliant. Sans valeur prescriptive (résumé), nature null.'  # remarques humaines : qualité, pièges, chapitres à ignorer
