notes: 'Pas de signets ; arbre réécrit depuis le sommaire imprimé (p.3), toc_source agent, page_offset 2 vérifié (p.5 = imprimée 3, p.97 = 95). Chapitres non numérotés, pas de §. Chaque aptitude suit le plan bases théoriques / principes d''application / exemples pratiques ; les plus longues (motivation, confiance en soi, canaliser la psyché) sont coupées en bases + exemples. Texte de bonne qualité ; ligature « fi » souvent coupée par une espace (« confi ance », « effi cace »). Schémas perdus ou en étiquettes éclatées (p.11 stades de développement, p.50 styles d''attention) ; fiches d''exercices avec en-têtes « Domaine d''intervention / Groupe d''âge / Sport » parfois éclatés. Feuilles de travail p.88-93 (tableaux à remplir aplatis). Nœuds parents sans texte propre : 05, 14, 17, 24 ; l''intro des « trois techniques » est dans 06-visualisation.md. Ignorés : couverture, sommaire, pages blanches 2, 4, 95, 98, 99, impressum p.100 (p.94 = numéro de page seul).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
