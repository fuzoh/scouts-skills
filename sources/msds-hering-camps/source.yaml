notes: 'SPA React : convert --render obligatoire (~30 s) ; original/ contient désormais le DOM rendu (le sha256 du yaml reste celui des coquilles vides de l''ingest). Pages search, calendar et impressum exclues. Une page = un chapitre lettré du menu (accueil + A à H), toutes couvertes ; les titres de web_pages (premier sous-chapitre + « - HERING ») sont faux, index.md porte les titres h1. Rendu : texte français complet pour la prose et les listes d''étapes. Pertes trafilatura : les badges de rôle de chaque sous-chapitre (div.targets : Responsable de camp / RG / Coach, qui fait quoi) sont tous perdus ; listes de liens nus perdues (« Plus d''informations », liste « matériel de prêt J+S, cartes nationales, assurances Rega » en fin de A.1, séquences d''apprentissage BDNS de l''accueil) ; images de formulaires absentes. Ancres stables présentes sur le site (id de 24 caractères sur le div parent de chaque h2, utilisées par le menu, ex. #x82yvbelkwqwn8ta4mf6mt4b = F. Autorisation de camp) mais non reprises dans raw/ par convert : citer url + titre, ou relever l''ancre dans le menu.' # remarques humaines : qualité, pièges, chapitres à ignorer
