notes: 'Module d''information numérique J+S, exemple de planification (course d''orientation photos, camp d''été de 30 participant·e·s de 7 à 16 ans, 4 responsables). Pas d''ancres : citer url + titre. Pertes : données clés (camp, 5-10 ans et 11-15 ans, horaires), objectifs par tranche d''âge, ajustements (enfants fatigués : raccourcir la partie principale, plus de pauses ; forte chaleur : pauses pour boire, moins de points ; retard : raccourcir la conclusion), trois formes d''évaluation (participants, maîtrise, autoréflexion) ; ces éléments sont dans le rendu, pas dans raw/. Neuf par rapport aux PDF J+S de 2014 : cycle de planification J+S en cinq étapes, renvoi aux directives 2027 pour les exigences d''une activité J+S.' # remarques humaines : qualité, pièges, chapitres à ignorer
