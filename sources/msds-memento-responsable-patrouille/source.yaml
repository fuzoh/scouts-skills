notes: 'Mémento « Étincelle » pour responsables de patrouille (branche Éclais), édition 2021, réf. imprimée 2145.01.fr. Pas de signets ; index réécrit depuis la table des matières p.3 ; pied de page = page physique (page_offset 0). Hors index : couverture p.1, page « À remplir » p.2, table des matières p.3. Texte complet (97 % des mots) mais tableau Quand/Quoi p.11 aux colonnes mélangées (échéances séparées des tâches), pages à remplir vides (petits jeux p.18, contacts p.21), grille de mots croisés p.22 perdue (seuls les chiffres restent), illustrations perdues. Impressum p.23 dans 10-contacts-devinettes.md.' # remarques humaines : qualité, pièges, chapitres à ignorer
