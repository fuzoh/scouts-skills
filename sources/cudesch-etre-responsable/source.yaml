notes: 'Livre BookStack du cudesch numérique (cudesch.scout.ch, MSdS), 1 page d''accueil + 9 chapitres + 25 pages ; manifeste dans l''ordre de lecture du livre. Les pages de chapitre portent l''introduction du chapitre suivie de la liste de ses pages avec extraits (lien et premières lignes), à ignorer. Chapitre §7 Filles et garçons : la page convertie ne contient que du bruit de navigation du site (menu, liens, « Passer au contenu principal ») sans titre ni introduction, sans valeur ; le contenu est dans §7.1. Chapitres §5 (Le contact avec les parents) : extraits tronqués seulement. Ancres bkmrk-… conservées sur les titres (citation `id <url>#bkmrk-…`). Pertes trafilatura : images (carte des méthodes de conduite, schéma des exemples de comportement), tableaux aplatis en texte mais complets (facteurs de conduite, situations et réactions, Que se passe-t-il / Que faire). Pages longues restant un seul fichier : Exemples de comportement difficile (1 560 mots), La prévention de la violence (1 440), Responsables de la maîtrise (1 460). Numéros § posés par l''agent.'                               # remarques humaines : qualité, pièges, chapitres à ignorer
