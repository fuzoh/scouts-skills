notes: 'Brochure OFSPO 2014 (n° 30.401.520 f), sans signets ; arbre réécrit d''après le sommaire imprimé (p.3), sous-sections ajoutées pour Equipe de moniteurs (p.9-11) et Programme de camp (p.18-24). page_offset 2 (page imprimée = physique − 2, vérifié p.4, 16, 50). Texte lisible et complet. Tableaux linéarisés cellule par cellule, colonnes avant / pendant / après mélangées : coach J+S / chefs de camp (p.6), répartition des tâches (p.9-10), points fixes de la journée (p.22). Encadrés latéraux parfois placés avant le titre de page (p.14, 16, 34, 36) : un découpage à la page les rattache à la section précédente ou suivante. Pictogrammes de renvoi (sécurité, documents en ligne) perdus. Contenu de 2014 : vérifier les règles J+S (SPORTdb, Voilà, expert du domaine de sécurité) contre js-manuel-sport-de-camp-trekking. Exclus : couverture, sommaire p.3, p.51 vide, impressum p.52.'
