notes: 'Module d''information numérique J+S (tool.jeunesseetsport.ch), une page = une section ; pas d''ancres : citer url + titre. Texte normatif des directives 2027 (offre, camp, journée J+S, activité J+S, temps d''activité sportive). Verdicts des cartes, relevés dans le rendu playwright mais absents de raw/ : construire un bivouac en petits groupes = actif ; chanter autour d''un feu = non actif (action partielle, pas de mouvement) ; saynète sur la prévention = actif ; regarder un film = non actif ; apprendre des nœuds assis à table = non actif ; nœuds en ateliers puis sur le terrain = actif. Neuf par rapport aux PDF J+S de 2014 : tout le régime 2027 (disparition de l''activité de camp, temps d''activité sportive, jour sans activité J+S, camp de 3 jours si un camp de 4 jours dans l''offre, formes caractéristiques sur l''offre). Renvoie au guide pour les offres de tous les sports J+S et au manuel SdC/T.' # remarques humaines : qualité, pièges, chapitres à ignorer
