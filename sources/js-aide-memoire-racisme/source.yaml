notes: 'Aide-mémoire OFSPO, édition 01/2026, à l''intention des moniteur·trice·s J+S/esa (pas spécifique au scoutisme). Texte complet pour les p.1 et 3. p.2 : le schéma des règles de comportement J+S/esa auquel renvoie « ci-contre » (quatre règles concernées : prendre et partager des responsabilités ; être ouvert à la nouveauté, à la différence et aux autres ; respecter tous les participants ; agir et communiquer de manière non violente) est un graphique absent de raw.md (visible dans `pdftotext -layout`) ; l''ordre des encadrés p.2 suit la mise en page. Liens de la p.3 conservés (glossaire network-racism, boussole éthique Swiss Olympic, Swiss Sport Integrity, fiche MSdS « Ouvert à toutes » pp. 20-21, aide-mémoire J+S « Propos discriminatoires »). La vidéo et le guide DSJ cités sont en allemand. Contient des exemples de termes discriminatoires cités comme tels. Sans valeur prescriptive propre, nature null.'  # remarques humaines : qualité, pièges, chapitres à ignorer
