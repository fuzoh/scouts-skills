notes: 'Page jugendundsport.ch publiée le 2025-11-04, une page = une section (ancres <!-- #… --> conservées pour citer l''url et l''ancre). Contenu : aide à la décision en quatre questions, règles de sécurité générales et routières, domaines de sécurité Montagne, Hiver (pentes 30°, degré d''avalanche 1-2, sous 1800 m) et Eau (compétences de surveillance), sports soumis à dispositions particulières, sports exclus (canyoning, saut à l''élastique, eaux vives III et plus), SAPC par prestataires commerciaux (la direction assume la responsabilité générale), activités à l''étranger. Les titres des items d''accordéon sont restitués en gras par convert. Vérifier le vocabulaire (groupe cible, chef de camp) à la date d''application 2027 : applies_from non posé, la page ne l''indique pas.'
