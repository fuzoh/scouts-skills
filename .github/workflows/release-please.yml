name: Release

# Prépare le PR de release à chaque push sur main (conventional commits) ; à la fusion du PR,
# release-please crée le tag et la release GitHub, puis le job upload y joint les deux zips.
# Noms de zip sans version : lien stable https://github.com/<repo>/releases/latest/download/scouts.zip
on:
  push:
    branches:
      - main

permissions: {}

# Une release à la fois : une exécution plus récente attend la fin de la précédente.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # PAT (et non GITHUB_TOKEN) : les PR et tags créés déclenchent alors la CI
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  upload:
    name: Zips en assets de release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          # pas de cache : les zips publiés ne doivent rien devoir à un cache partagé
          enable-cache: false

      - name: Installer les dépendances
        run: uv sync

      - name: Construire les zips
        run: |
          uv run light index
          uv run build all --zip

      - name: Joindre les zips à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/scouts.zip dist/scouts-ressources.zip --clobber
