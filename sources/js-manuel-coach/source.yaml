notes: 'PDF chiffré AES-256 (copie interdite) ; pymupdf lit le texte sans mot de passe. Signets inutilisables (Vorwort/Einleitung allemands, doublons, résidus de trois PDF fusionnés « 2022-0318_manual-coach-s8/s9/s12_FR.pdf », pages à 0 ou 1) : arbre réécrit depuis le sommaire imprimé p.3 (toc_source: agent), chapitres non numérotés donc sans §. page_offset 0 (vérifié p.4, p.8, p.22). Texte de bonne qualité ; pertes : illustrations (légendes seules), schéma FTEM p.11 éclaté en titres et étiquettes, citations de témoins en italique fragmentées. Pages de titre de chapitre p.7, 13, 21 sans texte (fichiers 03, 08, 12 = renvois) ; p.20 blanche ; impressum p.26 exclu.'
