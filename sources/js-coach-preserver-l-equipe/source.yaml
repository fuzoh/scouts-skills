notes: 'Brochure OFSPO 2013, série Coach J+S ; numéro de commande imprimé « 30.060.710 d » sur la version française. Signets plats (16, niveau 1) : couverture et sommaire retirés, hiérarchie reconstruite depuis le sommaire imprimé (p.3), étapes 1 à 9 regroupées par phase, toc_source agent ; page_offset 2 (p.4 = 2, p.30 = 28). P.31 blanche et impressum p.32 exclus. Texte de bonne qualité ; pertes : tableau des rôles (p.16) avec colonne « comportement » séparée des définitions, aide-mémoires d''entretien (p.21, 25, 29) où les questions sont détachées des points numérotés, sociogramme et diagramme des champs d''action (p.17) décrits en texte mais exemples graphiques perdus. Vocabulaire « société sportive » : à transposer au groupe scout.' # remarques humaines : qualité, pièges, chapitres à ignorer
