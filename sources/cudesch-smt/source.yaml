notes: 'Livre BookStack du cudesch numérique (cudesch.scout.ch, MSdS, en ligne depuis janvier 2026), 1 page d''accueil + 6 chapitres + 28 pages (35 nœuds) ; index écrit par l''agent dans l''ordre de lecture de web_pages. Le chapitre 6 (Déficiences fréquentes) compte 12 pages : dix fiches par type de déficience (TSA, épilepsie, TDAH, trisomie 21, troubles de l''apprentissage, IMC, dystrophie musculaire, déficiences auditive, visuelle, de la parole), puis informations complémentaires et bibliographie. Les pages de chapitre ne portent que l''introduction suivie de la liste de ses pages avec extraits, à ignorer ; certaines sont en allemand dans le brut (première phrase de §1.1 non traduite sur le site : « Die PTA ist schweizweit… »). Ancres bkmrk-… conservées sur les titres, dont des ancres allemandes (bkmrk-separativ…). Pertes : marqueur @@ANC:bkmrk-page-title@@ non résolu en tête de §5.2 et §6.12, bruit de navigation en tête de §6.12 ; images, pictogrammes et cartes de communication non reproduits. Numéros § posés par l''agent (le site n''en a pas).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
