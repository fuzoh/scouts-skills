notes: 'Offre annuelle, périmée après 2027. Texte complet : introduction, inscription (bases de données des associations, formation@msds.ch), liens et fiche de chaque module (n° JS-CH, public, points forts, dates) ; pas de lieux. Mise en page à deux colonnes rendue sans structure : modules dans l''ordre colonne par colonne (non chronologique), calendrier graphique perdu (restes « JAN MARS MAI… »), titres génériques « MPE (JS-CH n°) » ; le texte du module « équipe » figure deux fois (215062 et 215076, dates différentes) ; quelques dates en allemand (« Montag … Mittwoch », 215073). Liens de la ligne « Liens » tronqués.'
