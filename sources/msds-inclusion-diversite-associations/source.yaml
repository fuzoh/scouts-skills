notes: 'Coédition MSdS / jubla / UCS avec le CSAJ, support du module J+S Inclusion et diversité ; issuer msds par convention. Pas de signets, pas de table des matières ni de pagination imprimée (page_offset 0) ; arbre réécrit depuis les titres numérotés, toc_source agent. Guide de l''inclusion (§3.2) découpé par étapes (non numérotées dans le PDF, titres « Étape N » repris). Plages arrondies à la page : fin de 4.2 dans 18 (regroupé avec 4.3), début de p.58 = fin de 7.2.2 dans 28-prevention. Pages blanches p.2, 4, 8, 12, 32, 40, 48, 50, 54 ; remerciements p.61 et impressum p.64 hors index. Texte presque complet (96 %), césures de fin de ligne non recollées (« in clusion »), encadrés de questions de réflexion et conseils conservés, illustrations perdues ; p.38 un peu lacunaire (84 %).' # remarques humaines : qualité, pièges, chapitres à ignorer
