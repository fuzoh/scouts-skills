notes: 'Brochure OFSPO 2018 (n° 30.461.530 f), avec Swiss Orienteering, sans signets ; arbre réécrit d''après le sommaire imprimé (p.3). page_offset 2 (vérifié p.5, 7, 18). Les lettrines N, O, R, D, A sont perdues dans raw.md (titres « ord », « rientation », etc. ; acronyme p.5 sans ses initiales) : titres rétablis dans index.md. Graphique FTEM de la CO (p.4) en texte éclaté, aperçu des symboles de carte (p.6) et plan de situation de Macolin (p.18) en image, texte dérisoire. Exercices tirés de « It''s COOL » (sCOOL) lisibles. Exclus : couverture, sommaire p.3, p.19 vide, impressum p.20.'
