notes: 'Cadre de référence J+S SdC/T 2027 pour expert·e·s (OFSPO, extranet ILIAS), contraignant seulement pour les objectifs du module ; une page = une section de lecture. Module de formation continue « Activités SdC/T » : 1 jour (6 h), admission, prolongation des reconnaissances, domaines de compétences, niveaux d''approfondissement, évaluation et validation, objectifs 1.1 à 3.3. Texte propre ; tableaux du chap. 5 mélangés (voir fidelity_notes). Document sur l''extranet J+S ILIAS derrière login : url et file_url vides. applies_from déduit : cadres de référence 2027 (le document ne donne pas de date ; il indique « Version 1.0 »).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
