[project]
name = "scouts-skills"
version = "0.5.0"
description = "Skills du scoutisme suisse et leur fabrique : ingestion, conversion, indexation des sources officielles, build des packs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT"]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pymupdf4llm>=0.0.20",
    "markitdown[docx,pptx,xlsx]>=0.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "markdown-it-py>=3",
]

[project.optional-dependencies]
web = ["playwright>=1.47"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ingest = "scripts.ingest:app"
discover = "scripts.discover:app"
convert = "scripts.convert:app"
index = "scripts.index:app"
split = "scripts.split:app"
redact = "scripts.redact:app"
inventory = "scripts.inventory:app"
concepts = "scripts.concepts:app"
recover = "scripts.recover:app"
referentiels = "scripts.referentiels:app"
build = "scripts.build:app"
light = "scripts.light:app"
site = "scripts.site:app"
check-urls = "scripts.check_urls:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
