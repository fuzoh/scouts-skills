notes: 'Page jugendundsport.ch « Guide pour les offres de tous les sports J+S et de tous les organisateurs », publiée le 2026-07-28 et mise à jour en continu : texte contraignant. Au 2026-11-19 elle est encore rédigée dans le vocabulaire 2026 (« groupe cible », complément « chef de camp ») : applies_from est donc laissé à null, relire la page à chaque veille. Source distincte du PDF js-guide-offres-sct (2023), qui n''est pas remplacé. Une page = une section : le pipeline web ne découpe pas une page en chapitres, citer l''url et l''ancre (#Camps-J+S, #Définition-d''un-camp, #Direction-du-camp, #Durée-du-camp, #Durée-des-activités, #Nuitées, #Premier-et-dernier-jour, #Journées-sans-entrainement). Utile au scoutisme : offre, lieu, camps J+S du groupe d''utilisateurs 3 (Sport de camp/Trekking : camp de trois jours si un autre camp de la même offre dure au moins quatre jours, journées sans entraînement selon la durée). Chapitre par sport (tailles de groupes) absent.'
