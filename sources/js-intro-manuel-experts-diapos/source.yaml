notes: '20 diapositives avec notes du conférencier (texte utile dans les notes) ; p.N = numéro de diapo. Découpé en 4 blocs (toc_source: agent). Images perdues (noms de fichiers Grafik seuls) ; diapos 3-5 : chiffres de l''énigme du parking en vrac (réponse 87 dans les notes) ; diapos 16 et 19 : étiquettes de la matrice et des quatre parties du manuel en désordre, l''ordre correct est dans les notes ; diapo 2 vide. Présente l''édition antérieure du manuel d''experts (136 p., voir history de js-manuel-experts) : le renvoi « 136 pages » et les « 34 recommandations d''action » sont à recouper avec l''édition 2024. Diapo 20 : [identifiants retirés] (accès au manuel en clair dans l''original et raw.md, caviardés dans la section par `redactions`), à ne pas reprendre dans un skill.'
