notes: 'Cadre de référence J+S SdC/T 2027 pour expert·e·s (OFSPO, extranet ILIAS), contraignant seulement pour les objectifs. Module « Technique de cordes et constructions » (formation continue, 1 jour de 6 h, prolonge les reconnaissances) : seul des cinq à avoir un objectif 2.3 (matériel de cordage et de construction de camp) ; contenus nœuds, ponts de cordes, tyroliennes, constructions de camp, descente en rappel, journal de cordage. Pas de mention du domaine de sécurité. Extranet J+S ILIAS derrière login : url et file_url vides. applies_from déduit : cadres de référence 2027 (aucune date dans le document ; « Version 1.0 »).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
