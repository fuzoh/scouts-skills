notes: 'Livre BookStack du cudesch numérique (cudesch.scout.ch, MSdS), brochure de la branche Eclais (12 à 15 ans environ), 1 page d''accueil + 13 chapitres + 41 pages ; ordre de lecture du livre. Les pages de chapitre portent l''introduction du chapitre suivie de la liste de ses pages avec extraits (lien et premières lignes), à ignorer. Ancres bkmrk-… conservées sur chaque titre (citation `id <url>#bkmrk-…`). Pertes trafilatura : images (schémas, exemples de constructions), et le tableau de §1.2 (voir fidelity_notes ; texte des cases partiellement en allemand, repris de l''édition alémanique). Les renvois de chapitre dans le texte (« chapitre 4.4 ») suivent la numérotation imprimée de la brochure, qui diffère de la numérotation § posée ici par l''agent (le site n''en a pas). Pages les plus longues : §4.4 Les responsables de patrouille et leur encadrement et §5.3 La particularité des activités en patrouille (2 050 à 2 250 mots, ce dernier avec un tableau de sécurité exemple), un fichier chacune.'                               # remarques humaines : qualité, pièges, chapitres à ignorer
