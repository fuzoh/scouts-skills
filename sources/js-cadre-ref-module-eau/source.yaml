notes: 'Cadre de référence J+S SdC/T 2027 pour expert·e·s (OFSPO, extranet ILIAS), contraignant seulement pour les objectifs. Module thématique « Eau » (formation continue ; durée minimale « 2 jours (6 heures de formation) », formulation de la source ; selon le mainteneur, les 2 jours sont une exigence de la SSS et J+S ne demande que 6 h sur l''ensemble du cours), distinct du module « Domaine de sécurité Eau » ; ligne Qualification propre à ce module ; après réussite, brevet SSS « Base Pool » et module « Lac » demandables. Contenus : règles et formations SSS, sauvetage aquatique, délimitation d''avec le domaine de sécurité. Coquille de la source : « p. 42-29 » (lire 42-49). Extranet J+S ILIAS derrière login : url et file_url vides. applies_from déduit : cadres de référence 2027 (aucune date dans le document ; « Version 1.0 »).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
