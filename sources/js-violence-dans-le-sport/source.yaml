notes: 'Édition 2008 (mobile / HEFSM), ancienne ; vérifier s''il existe une version plus récente sur jeunesseetsport.ch. Pas de signets ; index réécrit depuis le sommaire p.3, page_offset 2 (vérifié p.5, p.22). Articles et études de cas tirés surtout du sport scolaire et de clubs (judo, hockey, football), peu de lien direct avec le scoutisme. Texte complet (99 %) ; encadrés d''experts (Valkanover, Gautschi, Lehmann, Moesch) et citations en exergue intercalés dans le flux, parfois en milieu de paragraphe. Hors index : couverture p.1-2, sommaire p.3, p.4 et p.23 blanches, impressum p.24.' # remarques humaines : qualité, pièges, chapitres à ignorer
