notes: 'Cadre de référence J+S Sport de camp/Trekking pour expert·e·s (OFSPO, 105-107.01.fr, version 1.0), contraignant : seuls les objectifs du module le sont, contenus et ressources sont indicatifs. Cadre de 2027, application dès le 2027-01-01 déduite : cadres de référence 2027, le document ne donne pas de date. Document extranet J+S ILIAS derrière login : url et file_url laissés vides. Le texte est bon (chapitres 1 à 4) ; p.1 couverture et p.2 table des matières (dans la section 01, ignorer). Contenu : fiche du module Domaine de sécurité Eau (durée 4 jours / 24 h, admission, qualification, reconnaissance), principes d''encouragement et d''évaluation, objectifs du module par domaine de compétences. Objectifs 1.1-1.9, 2.1-2.5, 3.1-3.5 (cours d''eau, radeaux et canots, nage en rivière).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
