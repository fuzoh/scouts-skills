notes: 'Réimpression 2014 d''un contenu de 2001. Pas de signets ; une forme de tournoi par page d''après le sommaire imprimé (p.3, « Tournoi par double K.-O. » manquant dans l''arbre PageIndex), toc_source agent, page_offset 2. Texte quoi/comment/pourquoi de bonne qualité ; schémas de tableaux (K.-O., double K.-O., classement, groupes, sapin) réduits à des suites de numéros et de noms, à lire dans le PDF. Formes pensées pour les sports de raquette (badminton, squash, tennis, tennis de table). Pages blanches p.2, 23 ; impressum p.24 ignoré.' # remarques humaines : qualité, pièges, chapitres à ignorer
