notes: 'Pas dans le catalogue Downloads au 2026-10-17 ; remplace la brochure « Faire un retour, qualifier et encourager au sein des cours de formation » 2023 (detail/57, 3_rqe_fr_rz_low_23.pdf), non ingérée. raw.md INCOMPLET : pymupdf4llm a perdu environ 70 % du texte (6 900 mots contre 22 900 dans le PDF ; texte sous les graphismes Word ignoré) ; index.md est prêt (pages physiques), il reste à reconvertir (ignore_graphics) puis relancer split avant de passer en indexed ; résumés d''index.md écrits sur le texte complet (pdftotext). Titres de la table des matières en « encouragement », corps du texte en « accompagnement » (index.md suit le corps) ; table des matières décalée d''une page dès 3.2.1. Plages à la page près : deux sections qui se partagent une page sont regroupées dans un même nœud (titre « 2.2.7 … ; 2.2.8 … »), une section qui commence en bas de page a son début dans le fichier précédent ; un chapitre garde sa première sous-section quand elles partagent la page (« §3 … ; 3.1 … »). Pied « Page N » = page physique (page_offset 0) ; p.1-5 (couverture, impressum, table des matières) hors index. Version de travail : renvois « LIEN … » non résolus, renvois internes avec une ancienne numérotation.' # remarques humaines : qualité, pièges, chapitres à ignorer
