notes: 'PDF chiffré AES-256 (copie interdite) ; pymupdf lit le texte sans mot de passe. extranet ILIAS J+S, version 2026. page_offset 0. Texte globalement lisible mais pertes importantes dans raw.md actuel : fiches d''activité p.67, 69, 71, 73, 75 vides (la 2e fiche de chaque forme caractéristique), infographie « Gestion de la sécurité » et procédure ORA p.46-47 en image (vide), règles de comportement p.5 (ill. 1) en image, texte partiel p.8, 24, 31, 50-52, 64 (encadrés et schémas). Un convert avec la reprise ignore_graphics (scripts/convert.py actuel) récupère les fiches et la plupart de ces pages : relancer convert puis split, index.md reste valable. Tableau 3 (degrés de développement, p.19) : les cellules d''appréciation sont en allemand (calque caché « Gering/mittel ausgeprägt »). Ordre des blocs parfois inversé (titre de page après la colonne de gauche). Signets parasites retirés (Methodische Hinweise, Spielgrundformen, « Gestion de la sécurité » en double) ; p.42-45 = « Encadrer un groupe efficacement en recherchant la sécurité » d''après le sommaire imprimé. Pages de titre de chapitre (p.13, 23, 33, 63) sans contenu.' # remarques humaines : qualité, pièges, chapitres à ignorer
