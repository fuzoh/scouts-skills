notes: 'Impression PDF (Chrome) de la page publique BDNS « Structure de la formation » de la discipline Sport de camp/Trekking, déposée par le mainteneur le 2026-10-18 comme « offre de cours » J+S. Reconstitution des deux colonnes d''après la mise en page : jusqu''au 31.12.2026 : Cours de moniteurs/trices ; CM pour personnes avec formation péd. ; Responsable de camp ; Domaine de sécurité Montagne ; Eau ; Hiver ; Prévention ; Activités SdC/T ; Technique de cordes et constructions ; Cours d''experts ; MP expert-e-s du domaine de sécurité. Dès le 1.1.2027 : Cours introduction ; Domaine de sécurité Eau ; Domaine de sécurité Hiver ; Montagne ; Module de perfectionnement pour moniteurs SdC/T ; Durabilité ; Nature et environnement ; Diversité et inclusion ; Cours d''expert-e-s ; Module de perfectionnement pour expert-e-s. Groupe cible J = jeunes, E = enfants ; S = filière sport des jeunes (M, I non attribués sur la page). Page dynamique : à réimprimer si la structure change.'                               # remarques humaines : qualité, pièges, chapitres à ignorer
