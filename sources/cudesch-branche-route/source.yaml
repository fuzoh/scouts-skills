notes: 'Livre BookStack du cudesch numérique (cudesch.scout.ch, MSdS, en ligne depuis janvier 2026), 1 page d''accueil + 9 chapitres + 20 pages (30 nœuds) ; index écrit par l''agent dans l''ordre de lecture de web_pages. Chaque chapitre ne compte que 1 à 7 pages ; les chapitres Préambule, Scout un jour scout toujours, Vision, Formation, Encadrement et Perspectives ont une seule page du même titre que le chapitre. Les pages de chapitre ne portent que l''introduction du chapitre (souvent tronquée à « … ») avec la liste de ses pages ; plusieurs ont en tête le bruit de navigation du site et aucun titre `# ` (titre repris de web_pages). Ancres bkmrk-… conservées sur les titres. Pertes : les tableaux d''engagements (Au cours du temps, §5.3) et d''exemples des cinq relations (§6.1), ainsi que les schémas, sont des images ; marqueurs @@ANC:bkmrk-…@@ non résolus dans les cellules de tableaux (Développement global, Les sept méthodes, Vision) et titre de page non rendu en `# ` sur certains chapitres. Numéros § posés par l''agent (le site n''en a pas).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
