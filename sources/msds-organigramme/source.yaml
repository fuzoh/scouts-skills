notes: 'Organigramme (réf. 5012.01.fr) : p.1 = couverture, p.2 = organes et instances (associations cantonales, AD, ConF, comité, maîtrise fédérale, commissions), p.3 = organes fixes fédéraux avec les titulaires. Contient des noms de personnes et noms scouts (donnée périssable : à ne pas figer dans un skill, renvoyer à l''organigramme à jour). Les liens hiérarchiques (traits) sont perdus ; raw.md liste les cases dans l''ordre de la mise en page, avec quelques blocs dupliqués (Tâche essentielle Communication, spécialistes) ; légende bénévole / employé·e / fonction spéciale illisible (symboles perdus, seul « * » = employé·e subsiste). Les cases « Membre » de la p.2 sont vides.'
