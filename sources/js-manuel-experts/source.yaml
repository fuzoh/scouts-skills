notes: 'PDF chiffré AES-256 (copie interdite) ; pymupdf lit le texte sans mot de passe. Édition 2024 ; l''édition antérieure (136 p.) est dans history. Texte de bonne qualité, une colonne logique, page_offset 0. Pertes : illustrations (seules les légendes restent), étiquettes de schémas mêlées au texte (ex. 1.6 Camps, 3.5.1), bulles de citation fragmentées, titres de chapitre souvent en texte simple et chapeaux en <u>. Signets parasites retirés (Vorwort, Einleitung, Introduction rangée sous Avant-propos) ; titres 3.4.3 « Formes d''organisation » et 3.5.1 « Perception de soi » repris du sommaire imprimé (les signets disent « Modalités d''apprentissage » et « Générer des processus... »). Chap. 4 « Bonnes pratiques : boîte à outils » (p.135) n''est qu''une page de titre sans contenu ; bibliographie p.136-140. Les nœuds parents 1.4, 3.1-3.10 n''ont pas de texte propre (le chapeau du champ d''action est dans la première sous-section).' # remarques humaines : qualité, pièges, chapitres à ignorer
