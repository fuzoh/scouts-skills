notes: 'Atlas graphique de cartes fluviales : 33 pages sur l''Aare, 4 sur la Broye/Zihl, 8 sur la Limmat, 4 sur la Linth, 13 sur la Reuss, 40 sur le Rhin, 12 sur la Thur, 21 sur le Rhône, au 1:25 000 : seul index.md existe (extraction: catalogue, pas de raw.md, original à consulter). Document en allemand, sans équivalent français connu ; seules les cartes du Rhône (feuilles 178-195 et généralités genevoises p.142) sont en français. Daté : état 2010-2011 (instantané au 31.07.2010, sans prétention d''exhaustivité), ouvrages, dangers, numéros de téléphone et adresses de l''annexe 1 ont pu changer ; ne remplace jamais la reconnaissance sur place (règlement 57.004) ni les prescriptions J+S du domaine de sécurité Eau. Les lacs ne sont pas couverts, pas plus que le Doubs, la Sarine, le Tessin ou l''Inn. Lacunes : Aare km 78-87,9 (lac de Bienne), Rhin km 81,2-124 (lac de Constance), Rhône km 83-153 (lac Léman). Glossaire allemand-français : Wehr / Stauwehr = barrage ; Schwelle = seuil ; Kraftwerk = centrale hydroélectrique ; Landestelle / Auswasserung = point d''accostage / de sortie de l''eau ; Einwasserung = mise à l''eau ; unbefahrbar / unpassierbar = non navigable / infranchissable ; Fahrverbot = interdiction de naviguer ; Talfahrt = descente (vers l''aval) ; bergwärts / talwärts = vers l''amont / vers l''aval ; Blatt = feuille de carte ; Flussbeginn / Flussende = début / fin du tracé ; Stromschnelle = rapide ; Untiefe = haut-fond ; Felsbrocken = bloc rocheux ; Fähre = bac ; Schleuse = écluse ; Pontonier-Fahrverein = société de pontonniers ; Naturschutzgebiet = réserve naturelle ; Hochwasser / Niederwasser = hautes / basses eaux ; rekognoszieren = reconnaître ; Anmeldung = annonce préalable.'                              # remarques humaines : qualité, pièges, chapitres à ignorer
