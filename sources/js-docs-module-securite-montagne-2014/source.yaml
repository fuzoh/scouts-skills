notes: 'Document OFSPO du 2014-06-10 (Sport des jeunes et des adultes) sur l''ancien module Domaine de sécurité Montagne : conditions d''admission, bilan de compétences (carte, boussole, équipement, planification, bivouac), contrôle de la matière apprise par thème, qualification et reconnaissance supplémentaire « Montagne ». applies_until laissé vide : remplacé par le cadre de référence 105-107 dès 2027, mais le document ne date pas sa fin et son état en 2026 n''est pas documenté. Vocabulaire ancien : SC/T, MP, statut « caduc », « module de formation continue » compté comme MP. Texte complet et bien ordonné ; ni url ni file_url (origine non retrouvée).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
