notes: 'Édition 2016 sans modification de contenu (contenu 2008) : modèle d''enseignement antérieur au modèle de formation de Macolin, utile comme fond théorique (concepts pédagogique, de motricité sportive, méthodologique). Sans signets : arbre réécrit depuis le sommaire imprimé (p.2), titres localisés par recherche dans le PDF ; titres non numérotés, pas de §. page_offset 2 (imprimé 1 = p.3, vérifié p.11 et p.41). Retirés : couverture p.1, sommaire p.2, listes des graphiques et tableaux p.42, impressum p.44. Texte de bonne qualité sauf tableaux (stades de développement p.14-15, modèles et tableaux du concept méthodologique) lus colonne par colonne, cellules mêlées ; graphiques perdus (seules les légendes restent) ; citations en exergue converties en titres ## en italique. Le nœud « La philosophie de la formation » n''a pas de texte propre (titre de chapitre dans 04).' # remarques humaines : qualité, pièges, chapitres à ignorer
