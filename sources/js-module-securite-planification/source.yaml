notes: 'Module d''apprentissage J+S, deuxième séquence SdC/T (prérequis : planifier-randonnee). Pas d''ancres : citer url + titre. Renvoie à l''aide-mémoire « Prévention des accidents et exigences en matière de sécurité en SdC/T » pour les activités exclues et les domaines Eau, Hiver, Montagne. Neuf par rapport aux PDF J+S de 2014 : cycle identifier / classifier / adapter + urgence, règle des zones de la matrice (vert acceptable, rouge toujours des mesures, jaune réduit si possible), concept de sécurité en deux parties, obligatoire pour les randonnées et les domaines de sécurité. Placement des risques de l''exemple relevé dans le rendu : 1 collision sur la route, 2 avalanche (si neige), 3 chute, 4 hypothermie, 5 épuisement.' # remarques humaines : qualité, pièges, chapitres à ignorer
