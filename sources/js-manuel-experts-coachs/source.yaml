notes: 'PDF chiffré AES-256 (copie interdite) ; pymupdf lit le texte sans mot de passe. Variante pour experts coachs du manuel des experts (js-manuel-experts), mêmes textes adaptés aux coachs, sans 1.4.4 Évaluer et qualifier ni chap. FTEM/sport. page_offset 0 (vérifié p.4, 28, 50, 76). Texte de bonne qualité, une colonne logique. Pertes : illustrations (légendes seules), étiquettes de schémas mêlées au texte (p.6 : fragments du schéma du modèle de Macolin, avec un « Lorem ipsum » résiduel du PDF), tableaux partiels (p.44, 47, 55), titres de section en texte simple, chapeaux en <u>. Signets parasites retirés (Vorwort, Einleitung, Introduction rangée sous Avant-propos). Le §2.1 porte dans le sommaire le titre « Instaurer un climat propice à l''apprentissage » mais regroupe les dix recommandations du domaine « Transmettre » (fichier 13-transmettre.md) ; le §2.2 « Encourager » regroupe aussi Innover et Se soucier de l''entourage. Nœuds 1.4, 2.1, 2.2 sans texte propre (leur chapeau est dans la première sous-section). Pages 8, 26, 78-79 vides ; impressum p.80 exclu.' # remarques humaines : qualité, pièges, chapitres à ignorer
