notes: 'Modèle de budget/décompte, une entrée par feuille : sept types de cours (Top, Panorama, Spectre, Gilwell, Coach, week-end, jour) + Décompte. Les feuilles de cours ne diffèrent que par le type de cours et les montants unitaires/maximaux (ex. programme CHF 40 Top, 50 Panorama) ; formules rendues par leur valeur (0), cellules vides en NaN. Basé sur la directive du 24.03.2026 (voir cofor-financement-cours-federaux). Bug split : chaque entrée recevait tout raw.md, 01-08 découpés à la main par feuille (rejouer `split` les écraserait).'
