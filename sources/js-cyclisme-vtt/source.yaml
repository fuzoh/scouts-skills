notes: 'Brochure OFSPO 2017 (n° 30.436.500 f), sans signets ; index par titres numérotés, nœuds couverture et sommaire retirés. page_offset 2 (vérifié p.5, 19, 42). Une technique de pilotage par page (§3.1-3.33), chaque fiche : points clés/OEC, conseils, Acquérir / Appliquer / Créer, formes de jeu. §2 et §3 n''ont pas de page propre (renvoi aux sous-sections). Texte lisible ; plusieurs fiches en tableau markdown (p.19-25, cellule Conseils parfois dupliquée) ; flèches → perdues (« au plat  raide ») ; séquences photo réduites aux numéros 1-7 ; codes QR vers les vidéos mobilesport.ch perdus. Brochure de discipline Cyclisme, pas Sport de camp/Trekking : utile pour une activité vélo en camp. Exclus : couverture, sommaire p.3, p.4 et p.43 vides, impressum p.44.'
