notes: 'Dépliant graphique de 2 p. : texte quasi complet dans raw.md, y compris les huit méthodes de la p.2 (mots-clés + modifications), mais les encadrés sont dans l''ordre de la mise en page. Pertes : le paragraphe « Les relations » (p.1) est tronqué à « 25). » (le PDF dit : cinq relations présentées en mots-clés par branche dans un graphique, p.16-25 du profil), liste des downloads sans liens, couleurs et pictogrammes. Cette liste de huit méthodes est aussi la meilleure vue des changements de la nouvelle version.'
