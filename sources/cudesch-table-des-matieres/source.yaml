notes: 'Table des matières 2015 du cudesch avec correspondance aux contenus des cours de base et RU ; sert de carte du cudesch, pas de contenu. Absent du catalogue Downloads au 2026-10-17. Trois colonnes (thèmes / ressources en ligne / contenus de cours) : p.1-9 rendues en texte avec les colonnes entrelacées (numéros de chapitre, titres, contenus de cours sur des lignes séparées, à reconstituer à la main), puces perdues, cellules fusionnées coupées d''une page à l''autre ; p.6 et p.10 en tableau markdown (Col1-Col3, cellules multi-lignes avec <br>, cellules vides). Liens des ressources en ligne vers l''ancien site scout.ch (périmés). Renvois * / ** (branche Louveteaux / Éclais seulement) en pied de p.10.'
