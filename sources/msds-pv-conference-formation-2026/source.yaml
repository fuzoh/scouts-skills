notes: 'Procès-verbal de la conférence formation (ConfFor) du 12.09.2026 à Berne, publié le 14.10.2026 ; sert de commentaire explicatif des nouveautés J+S 2027 (diapositives correspondantes : msds-conffor-2026-diapositives, les renvois « Diapositives N-M » du PV y mènent). Source de compte rendu, non prescriptive (nature null) : ce qu''elle dit des exigences 2027 doit être recoupé avec le manuel SdC/T, le modèle de formation et les check-lists. Découpe : un fichier par bloc de pages, les points de l''ordre du jour qui partagent une page sont regroupés (§2.1-2.3 p.4-6 ; §2.4-2.6 p.7-8 ; §2.7-2.8 p.9 ; §2.9 et §3 p.10 ; §6 et §7 p.23-24) ; sections à plat, sans parent. p.11-18 : la partie 2 était présentée sous forme de posters (images), raw.md ne garde que l''en-tête de page ; les questions reçues sur les posters sont p.19. Ateliers sans procès-verbal : §3 (structure de la formation et manuel) et §6 (coordination). Nomme des personnes (totems et noms civils, p.1-2, p.3, remerciements p.23-24) : texte officiel, non caviardé. Contrôle : aucun identifiant ni mot de passe dans raw.md. Points de contenu : voir sections §2.1-2.9 ; le texte de la p.5 fixe la nouvelle formulation des exigences J+S dès janvier 2027. Texte « Seite N » en pied de page (allemand) = numérotation du PV, égale à la page physique.'  # remarques humaines : qualité, pièges, chapitres à ignorer
