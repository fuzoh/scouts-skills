notes: 'Brochure OFSPO 2019, 5e édition actualisée (n° 30.401.800 f), sans signets ; arbre réécrit d''après le sommaire imprimé (p.3), sous-sections ajoutées pour l''excursion (bulletin d''avalanches p.15, méthode 3 × 3 p.16, facteur humain p.17) ; les cinq règles fondamentales restent dans le nœud parent (p.12-14). page_offset 2 (vérifié p.5, 23, 29). Texte lisible. Tableau du refroidissement éolien (p.27) mal aligné (ligne d''en-tête des températures tronquée) ; tableaux hypothermie (p.27) et gelures (p.28) linéarisés cellule par cellule ; check-list d''équipement (p.26) en liste plate. Schémas de construction d''abris (p.5-8) perdus. Exclus : couverture, sommaire p.3, p.31 vide, impressum p.32.'
