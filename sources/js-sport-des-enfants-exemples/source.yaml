notes: 'PDF sans signets ; arbre réécrit d''après la table des matières imprimée (p.3), toc_source agent, page_offset 2 vérifié sur les pieds de page (p.4 = 2, p.50 = 48, p.70 = 68). Pas de §. Fiches d''exercices en colonnes (Exercice de base / Variantes, Mouvement, Matériel, Description, Objectif, Renvoi) : texte complet mais en ordre de blocs, titres de jeux parfois groupés loin de leur description, illustrations perdues. « Percevoir son propre corps », « bilatéralité » et « mouvements croisés » commencent en milieu de page : regroupés dans les nœuds Perception (p.50-53) et Faire des liens (p.54-57). « Lancer et attraper » (p.28-31) dépasse 300 lignes mais n''a pas de sous-titres. Pages blanches p.2, 11, 27, 37, 39, 51, 61, 69, 71 ; impressum p.72 exclu.' # remarques humaines : qualité, pièges, chapitres à ignorer
