notes: 'Diapositives de la conférence formation du 12.09.2026 (91 p.), exportées en PDF (pied de page 14.10.2026 sur certaines) ; texte d''accompagnement : msds-pv-conference-formation-2026, dont les renvois « Diapositives N-M » correspondent aux p.N-M ici. Signets « Folie N » inutiles : arbre refait à la main d''après raw.md (parties du PV : p.1-6 ouverture, 7-33 partie 1, 34-36 atelier, 37-39 partie 2, 40-41 déroulement, 42-65 littérature de formation, 66-85 profil, 86-91 clôture). Beaucoup de diapositives sont des graphiques ou des titres seuls : le fond figure dans le PV. p.10 (slide « Einordnung : Warum wurde Jugend+Sport überarbeitet ? », en allemand) et p.11 sans texte dans raw.md. p.24 : schéma de parcours (étiquettes sans flèches), p.23 : durées des modules de la nouvelle structure (cours d''introduction 4 jours, cours de moniteur·rice 6 jours pour personnes avec formation pédagogique, responsable de camp 4 jours, domaines de sécurité, cours d''expert·e 8-9 jours) en texte épars : voir le modèle de formation pour les valeurs faisant foi. p.50 : renvoi au « Methodisches Arrangement » (allemand). p.1 : mot de passe Wi-Fi de la salle en clair dans l''original et raw.md avant caviardage ; règle `redactions` sur la section 01-ouverture, texte brut et section caviardés. Lexique terminologique mentionné p.46 transmis avec la mise en consultation des brochures, non inclus. Non prescriptive (nature null).'  # remarques humaines : qualité, pièges, chapitres à ignorer
