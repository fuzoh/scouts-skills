notes: 'Aide-mémoire « Météorologie » du manuel J+S Sports de montagne, éd. 2010 (30.905.1002 f), auteur G. Kappenberger, en français. Mise en page en colonnes et schémas : l''ordre de lecture est mêlé et la terminologie ISM p.1 est un tableau à deux colonnes aplati ; numéros de téléphone Météovox/Météocall d''époque, probablement périmés. Les règles de comportement face à l''orage (foudre, distance = secondes/3) sont complètes en p.2.'                               # remarques humaines : qualité, pièges, chapitres à ignorer
