# Registre d'une source. Copier dans sources/<id>/source.yaml.
# Les champs marqués (script) sont remplis par scripts/ingest ; ne pas éditer à la main.

id: cofor-checklist-cours-base          # <issuer>-<slug>, stable, voir METHODE.md
title: Checklist cours de base
issuer: cofor                           # msds | cofor | js | cudesch | autre
issuer_detail: ""                       # obligatoire si issuer = autre
ref: "314201fr"                         # numéro officiel, "" si absent
lang: fr                                # fr | de | en (autre que fr seulement sans équivalent fr)
type: pdf                               # pdf | docx | xlsx | pptx | web | image
url: https://pfadi.swiss/...            # page d'origine canonique (pas le lien direct au fichier si une page existe)
file_url: https://pfadi.swiss/....pdf   # lien direct au fichier, "" pour web
web_pages: []                           # (script) web seulement : {url, title, slug}, une entrée par page

status: collected                       # collected | triaged | converted | indexed | verified | superseded | rejected
decision: ""                            # keep | rejected, rempli au triage
rejected_reason: ""
extraction: text                        # text | vision | catalogue | none, posé au triage (voir METHODE.md)
fidelity: null                          # complete | partial ; vide = complete non évalué ; obligatoire à verified
fidelity_notes: ""                      # motif obligatoire si partial, ex. « cases de niveau perdues p.2-4 »

version: "v1"                           # telle qu'écrite par l'éditeur, "" si inconnue ; web : date retrieved
published: 2026-09-15                   # date du document, null si inconnue
retrieved: 2026-10-17                   # (script) date de téléchargement
sha256: ""                              # (script)
pages: 0                                # (script) pages PDF, diapos pptx, 0 sinon
stale: false                            # (script) true si le distant a changé
applies_from: null                      # AAAA-MM-JJ, sources prescriptives seulement : début d'application
applies_until: null                     # AAAA-MM-JJ, sources prescriptives seulement : fin d'application
nature: null                            # prescription | recommandation | exemple, sources prescriptives seulement

audience: [formateur]                   # responsable | formateur | expert-js | coach-js | cadre-cantonal
themes: [formation]                     # vocabulaire dans docs/taxonomie.md
concepts: []                            # termes du GLOSSARY.md, ex. [cours-de-base, qualification]

supersedes: []                          # ids remplacés par cette source
history: []                             # versions précédentes : {version, published, sha256, retired}
#  - version: "v0"
#    published: 2020-10-08
#    sha256: ""
#    retired: 2026-09-15

notes: ""                               # remarques humaines : qualité, pièges, chapitres à ignorer
redactions: []                          # caviardage appliqué par convert, redact et split : {section: NN-slug, pattern: regex, replace}
