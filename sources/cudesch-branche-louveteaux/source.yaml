notes: 'Livre BookStack du cudesch numérique (cudesch.scout.ch, MSdS), brochure de la branche Louveteaux (univers du Livre de la jungle), 1 page d''accueil + 14 chapitres + 42 pages ; ordre de lecture du livre. Les pages de chapitre portent l''introduction du chapitre suivie de la liste de ses pages avec extraits (lien et premières lignes), à ignorer. Ancres bkmrk-… conservées sur chaque titre (citation `id <url>#bkmrk-…`). Pertes trafilatura : images (illustrations, partitions et notes des chants, schémas). Particularités : §5.4 Lexique du Livre de la jungle est un tableau de vocabulaire ; §14 Chants louveteaux (7 chants) ne contient que les paroles, sans la musique ; §5.3 Le Livre de la jungle en toile de fond est la page la plus longue (2 900 mots) et reste un seul fichier. Le titre de §10.3 (Porotection) reprend la coquille du site. Numéros § posés par l''agent (le site n''en a pas).'                               # remarques humaines : qualité, pièges, chapitres à ignorer
