notes: 'Module d''apprentissage J+S, première des trois séquences SdC/T (suivent securite-planification et securite-realisation). Pas d''ancres : citer url + titre. Facteur de vitesse, relevé dans le rendu mais absent de raw/ : 2-4 kme/h groupe non entraîné, enfants, grand groupe avec charge ; 3-5 kme/h même groupe sans charge ; 3-5 kme/h groupe entraîné, jeunes, petit groupe avec charge ; 4-6 kme/h même groupe sans charge. Reconnaissance : état des sentiers et routes, couverture réseau, temps de marche effectif (liste partielle). Neuf par rapport aux PDF J+S de 2014 : kilomètre-effort (1 km à plat = 100 m de dénivelé positif = 150 m de dénivelé négatif en terrain raide), facteur de vitesse, points clés (point de non-retour, échappatoire).' # remarques humaines : qualité, pièges, chapitres à ignorer
