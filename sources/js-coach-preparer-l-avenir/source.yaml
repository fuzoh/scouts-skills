notes: 'Brochure OFSPO 2013 (n° 30.060.700 f), série Coach J+S, d''après Nagel et Schlesinger 2012. Sans signets : arbre réécrit depuis le sommaire imprimé (p.3), toc_source agent ; page_offset 2 (p.4 = 2, p.30 = 28). Couverture, page blanche, sommaire, p.31 blanche et impressum p.32 exclus. Texte de bonne qualité ; pertes : schéma de synthèse p.5 et modèle en cinq phases (p.15, mot isolé « Modifier ») réduits à des étiquettes, listes de contrôle en tableau (p.22, p.24) lues colonne par colonne (étapes puis résultats puis sources), illustrations perdues. « Le modèle en détail » découpé par phase (p.18-29). Vocabulaire « société sportive » : à transposer au groupe scout.'                               # remarques humaines : qualité, pièges, chapitres à ignorer
